    body {

      color: #fff;

    .glow {
      position: absolute;

      background: rgba(180, 0, 0, .08);
      filter: blur(70px);
      pointer-events: none;

    .glow.one { top: 8%; left: 50%; transform: translateX(-50%); }
    .glow.two { bottom: -15%; left: 50%; transform: translateX(-50%); }

    .card {

      position: relative;

      padding: 7px;

      border: 2px solid #9f0d0d;

      place-items: center;

    .logo {

      height: 100%;

      display: block;

      font-size: clamp(42px, 11vw, 70px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: .5px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255,0,0,.16);

      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.35;
      color: #cfcfcf;

      min-height: 72px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, #ff1717, #c80000);
      color: #fff;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 800;
      letter-spacing: .3px;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(255,80,80,.55) inset,
        0 12px 35px rgba(190,0,0,.35);
      transition: transform .15s ease, filter .15s ease;
    }

    .telegram-btn:active {
      transform: scale(.98);
      filter: brightness(.92);
    }

    .stats {
      margin-top: 34px;
      font-size: 17px;
      color: #d8d8d8;
